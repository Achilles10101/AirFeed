<!doctype html>
<!-- Experiment 2: millisecond clock. Film this with the iPhone, put the received video
     next to it on the same screen, take a screenshot. Latency = clock minus filmed clock. -->
<meta charset="utf-8">
<title>AirFeed clock</title>
<style>
  body { margin: 0; height: 100vh; display: grid; place-items: center; background: #000;
         color: #fff; font: bold 20vw/1 ui-monospace, Menlo, monospace; }
</style>
<div id="t"></div>
<script>
  const t = document.getElementById('t');
  (function tick() {
    t.textContent = (performance.now() % 100000 / 1000).toFixed(3).padStart(6, '0');
    requestAnimationFrame(tick);
  })();
</script>
